# ##################
# ## Window Rules ##
# ##################


# Open apps in specific Workspaces
windowrule = match:class ^(Firefox)$, workspace 1 silent

windowrule = match:class ^(Zotero)$, workspace 8 silent
windowrule = match:class ^(zen)$, workspace 1 silent
windowrule = match:class ^(chromium)$, workspace 1 silent
windowrule = match:class ^(emacs)$, workspace 5 silent
windowrule = match:class ^(codium)$, workspace 5 silent
windowrule = match:class ^(Marvin)$, workspace 9 silent
windowrule = match:class ^(obsidian)$, workspace 2 silent
windowrule = match:class ^(teams-for-linux)$, workspace 8 silent

windowrule = match:title ^(Extension)$, float on

windowrule = match:class file_progress, float on
windowrule = match:class confirm, float on
windowrule = match:class dialog, float on
windowrule = match:class download, float on
windowrule = match:class notification, float on
windowrule = match:class error, float on
windowrule = match:class splash, float on
windowrule = match:class confirmreset, float on
windowrule = match:title Open File, float on
windowrule = match:title branchdialog, float on
windowrule = match:title pavucontrol-qt, float on
windowrule = match:title pavucontrol, float on
windowrule = match:title file-roller, float on
windowrule = match:title ^(Media viewer)$, float on
windowrule = match:title ^(Volume Control)$, float on
windowrule = match:title ^(Volume Control)$, size 800 600
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, move 69.5% 4% on
windowrule = match:title ^(Open Files)$, size 1000 700 on
windowrule = match:title ^(Save File)$, size 1000 700 on
windowrule = match:title ^(Bluetooth Devices)$, float on


#windowrule = noblur,.*
# windowrule = opacity 0.89 override 0.89 override, .* # Applies transparency to EVERY WINDOW
windowrule = match:title ^(Bluetooth), float on
windowrule = match:title ^(steam)$, float on
windowrule = match:title ^(guifetch)$, float on # FlafyDev/guifetch
windowrule = match:class (dev.warp.Warp), tile on
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on
windowrule = match:title ^(Open File)(.*)$, center on
windowrule = match:title ^(Open File)(.*)$, float on
windowrule = match:title ^(Select a File)(.*)$, center on
windowrule = match:title ^(Select a File)(.*)$, float on
windowrule = match:title ^(Choose wallpaper)(.*)$, center on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on
windowrule = match:title ^(Open Folder)(.*)$, center on
windowrule = match:title ^(Open Folder)(.*)$, float on
windowrule = match:title ^(Save As)(.*)$, center on
windowrule = match:title ^(Save As)(.*)$, float on
windowrule = match:title ^(Library)(.*)$, center on
windowrule = match:title ^(Library)(.*)$, float on
windowrule = match:title ^(File Upload)(.*)$, center on
windowrule = match:title ^(File Upload)(.*)$, float on
windowrule = match:title ^(Microsoft-edge)$, tile on
windowrule = match:title ^(Nextcloud)$, float on
windowrule = match:title ^(blueman-manager)$, float on
windowrule = match:title ^(nm-connection-editor)$, float on

# Browser Picture in Picture
# Picture-in-Picture
windowrule = keep_aspect_ratio on, move ((monitor_w*0.73)) ((monitor_h*0.72)), size (monitor_w*0.25) (monitor_h*0.25), float on, pin on, match:title ^(Picture(-| )in(-| )[Pp]icture)$

# Dialogs

# Tearing
windowrule = match:class (steam_app), immediate on

# No shadow for tiled windows
windowrule = no_shadow on, match:float 0

# ######## Layer rules ########
layerrule = xray 1, match:namespace .*
# layerrule = noanim, .*
layerrule = no_anim on, match:namespace walker
layerrule = no_anim on, match:namespace selection
layerrule = no_anim on, blur on, ignore_alpha 0.6, match:namespace overview
layerrule = no_anim on, match:namespace anyrun
layerrule = no_anim on, blur on, ignore_alpha 0.6, match:namespace indicator.*
layerrule = no_anim on, blur on, ignore_alpha 0.6, match:namespace osk
layerrule = no_anim on, match:namespace hyprpicker
layerrule = blur on, ignore_alpha 0.6, match:namespace shell:*

layerrule = no_anim on, match:namespace noanim
layerrule = blur on, ignore_alpha 0, match:namespace gtk-layer-shell
layerrule = blur on, ignore_alpha 0.5, match:namespace launcher
layerrule = blur on, ignore_alpha 0.69, match:namespace notifications

# ags
layerrule = animation slide left, match:namespace sideleft.*
layerrule = animation slide right, match:namespace sideright.*
layerrule = blur on, match:namespace session

layerrule = blur on, ignore_alpha 0.6, match:namespace bar
layerrule = blur on, ignore_alpha 0.6, match:namespace corner.*
layerrule = blur on, ignore_alpha 0.6, match:namespace dock
layerrule = blur on, ignore_alpha 0.6, match:namespace cheatsheet
layerrule = blur on, ignore_alpha 0.6, match:namespace sideright
layerrule = blur on, ignore_alpha 0.6, match:namespace sideleft
layerrule = blur on, ignore_alpha 0.6, match:namespace indicator*


layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-notification-window
# for xwaylandwindowbridge
#
#
#windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 override
#windowrule = match:class ^(xwaylandvideobridge)$, noanim
#windowrule = match:class ^(xwaylandvideobridge)$, noinitialfocus
#windowrule = match:class ^(xwaylandvideobridge)$, maxsize 1 1
#windowrule = match:class ^(xwaylandvideobridge)$, noblur
#windowrule = match:class ^(xwaylandvideobridge)$, nofocus
#
#
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
 workspace = w[tv1], gapsout:0, gapsin:0
 workspace = f[1], gapsout:0, gapsin:0

windowrule = border_size 0, rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, rounding 0, match:float 0, match:workspace f[1]

